name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # L04 resolves one historical release commit from the repository
          # history. A shallow checkout makes that selection ambiguous or
          # unavailable and can turn a real rollback failure into a false pass.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js for rollback/WebCrypto rehearsal
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Verify L04 rollback prerequisites
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        shell: pwsh
        run: |
          $git = Get-Command git -ErrorAction SilentlyContinue
          $node = Get-Command node -ErrorAction SilentlyContinue
          if (-not $git -or -not $node) {
            throw 'L04 prerequisite failure: Git and Node.js are required.'
          }
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw 'L04 prerequisite failure: a 64-bit Windows runner is required.'
          }
          Write-Host 'L04 prerequisites present: Git and Node.js'

      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9" "playwright>=1.52,<2"

      - name: Install Chromium for rendered UI tests (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium for rendered UI tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python -m playwright install chromium

      - name: Compile all modules
        run: python -m py_compile skills/summon/scripts/run_subagent.py skills/summon/scripts/_loader.py skills/summon/scripts/_resolver.py skills/summon/scripts/_builder.py skills/summon/scripts/_executor.py skills/summon/scripts/_spawn.py skills/summon/scripts/_stream.py skills/summon/scripts/_doctor.py skills/summon/scripts/_auth.py skills/summon/scripts/_rundir.py skills/summon/scripts/_council.py skills/summon/scripts/_manifest.py skills/summon/scripts/_jobs.py skills/summon/scripts/_receipt.py skills/summon/scripts/_installs.py skills/summon/scripts/_cli.py skills/summon/scripts/_background.py skills/summon/scripts/_telemetry.py skills/summon/scripts/_telemetry_audit.py skills/summon/scripts/_usage.py skills/summon/scripts/_usage_live.py skills/summon/scripts/_usage_runner.py skills/summon/scripts/_usage_advisory.py skills/summon/scripts/_context_compile.py skills/summon/scripts/_portable_result.py skills/summon/scripts/_apibackend.py skills/summon/scripts/_arkcli_backend.py skills/summon/scripts/_acpbackend.py skills/summon/scripts/_zcode.py skills/summon/scripts/_zai_coding_plan.py skills/summon/scripts/agy_stream_proxy.py skills/summon/scripts/_deliberation_context.py skills/summon/scripts/_deliberation_context_source.py skills/summon/scripts/_fleet.py skills/summon/scripts/_fleet_approval.py skills/summon/scripts/_fleet_dispatch.py skills/summon/scripts/_fleet_activation.py skills/summon/scripts/_fleet_runtime.py skills/summon/scripts/_deliberation.py skills/summon/scripts/_deliberation_agents.py skills/summon/scripts/_deliberation_store.py skills/summon/scripts/_deliberation_browser.py skills/summon/scripts/_deliberation_scheduler.py skills/summon/scripts/_deliberation_roster.py skills/summon/scripts/_deliberation_invocation.py skills/summon/scripts/_deliberation_replay.py skills/summon/scripts/_deliberation_recovery.py skills/summon/scripts/_deliberation_resume.py skills/summon/scripts/_deliberation_adapter.py skills/summon/scripts/_deliberation_phase_a.py skills/summon/scripts/_deliberation_live.py skills/summon/scripts/_deliberation_ui.py skills/summon/scripts/_conversation.py skills/summon/scripts/_conversation_page.py skills/summon/scripts/_conversation_runtime.py skills/summon/scripts/_swarm_protocol.py skills/summon/scripts/_swarm_coordinator.py skills/summon/scripts/_conversation_browser.py skills/summon/scripts/_conversation_ui.py skills/summon/scripts/_model_catalog.py tools/release_manifest.py tools/release_gates.py tools/release_contract.py summon.py install.py

      - name: Compile workspace modules
        run: >-
          python -m py_compile
          skills/summon/scripts/_chat_resume.py
          skills/summon/scripts/_workspace_admission.py
          skills/summon/scripts/_workspace_commands.py
          skills/summon/scripts/_workspace_content.py
          skills/summon/scripts/_workspace_demo.py
          skills/summon/scripts/_workspace_entry.py
          skills/summon/scripts/_workspace_layout.py
          skills/summon/scripts/_workspace_page.py
          skills/summon/scripts/_workspace_plan.py
          skills/summon/scripts/_workspace_protocol.py
          skills/summon/scripts/_workspace_runtime.py
          skills/summon/scripts/_workspace_state.py
          skills/summon/scripts/_workspace_transport.py
          skills/summon/scripts/_workspace_ui.py
          skills/summon/scripts/_workspace_view.py

      - name: Unit tests (dispatcher)
        run: python skills/summon/scripts/test_discovery.py

      - name: Unit tests (installer safety, isolated fake homes)
        run: python tests/test_install.py

      - name: Unit tests (release evidence manifest)
        run: python -m unittest tests.test_release_manifest tests.test_live_provider_gate

      - name: Unit tests (release version and migration contract)
        run: python -m unittest tests.test_release_contract

      - name: Unit tests (migration and telemetry GA gates)
        run: >-
          python -m unittest
          tests.test_migration_gate
          tests.test_telemetry_gate
          tests.test_telemetry_audit
          tests.test_telemetry_producer

      - name: Unit tests (L04 composed rollback and recovery)
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        shell: pwsh
        run: python -B tests/test_l04_composed_rollback.py

      - name: Unit tests (release evidence runner)
        run: python -m unittest tests.test_release_gates

      - name: Unit tests (Phase 0 and Phase 1 provider-inert contracts)
        run: >-
          python -m pytest -q
          skills/summon/scripts/test_phase0_contracts.py
          skills/summon/scripts/test_account_profiles.py
          skills/summon/scripts/test_astra_roster.py
          skills/summon/scripts/test_fable_roster.py
          skills/summon/scripts/test_claude_attribution.py
          skills/summon/scripts/test_install_drift.py
          skills/summon/scripts/test_kimi_timeout.py
          skills/summon/scripts/test_phase1_usage.py
          skills/summon/tests/test_phase1_usage_live.py
          skills/summon/scripts/test_phase1_usage_runner.py
          skills/summon/scripts/test_phase1_context_compile.py
          skills/summon/scripts/test_phase1_context_freshness.py
          skills/summon/scripts/test_phase1_context_source.py
          skills/summon/scripts/test_portable_result.py
          skills/summon/scripts/test_agy_1_1_22.py
          skills/summon/scripts/test_phase1_compatibility.py
          skills/summon/scripts/test_phase1_operator_workflow.py
          skills/summon/scripts/test_phase1_fleet_dispatch.py
          skills/summon/scripts/test_phase1_fleet_activation.py
          skills/summon/scripts/test_phase1_fleet.py
          skills/summon/scripts/test_phase1_fleet_approval.py
          skills/summon/scripts/test_phase1_fleet_runtime.py
          skills/summon/scripts/test_phase1_fleet_launch_evidence.py
          skills/summon/scripts/test_evidence_kernel.py
          skills/summon/scripts/test_job_control.py
          skills/summon/scripts/test_attempt_and_wait_regressions.py
          skills/summon/scripts/test_job_continuation.py
          skills/summon/scripts/test_background_publication_acceptance.py
          skills/summon/scripts/test_submission_accounting_public_acceptance.py
          skills/summon/scripts/test_submission_accounting.py
          skills/summon/scripts/test_submission_accounting_grant_acceptance.py
          skills/summon/scripts/test_submission_accounting_http_acceptance.py
          skills/summon/scripts/test_context_policy.py
          skills/summon/scripts/test_e07_context_economics.py
          skills/summon/scripts/test_workspace_policy_v2.py
          tests/test_e07_terminal_seal_acceptance.py
          skills/summon/scripts/test_e12_turn_fork_acceptance.py
          skills/summon/scripts/test_fork_and_claim_regressions.py
          skills/summon/scripts/test_r01_queued_version_acceptance.py
          skills/summon/scripts/test_r02_candidate_fork_acceptance.py
          skills/summon/scripts/test_job_resume.py
          tests/test_profile_resume_rotation_acceptance.py
          skills/summon/scripts/test_historical_job_claim_acceptance.py
          skills/summon/scripts/test_resume_capabilities.py
          skills/summon/scripts/test_evidence_guards.py
          skills/summon/scripts/test_opencode.py
          skills/summon/scripts/test_zcode.py
          skills/summon/scripts/test_background_read_roots.py
          skills/summon/scripts/test_codex_stream.py
          skills/summon/scripts/test_executor_ownership.py
          skills/summon/scripts/test_executor_observation_regressions.py
          skills/summon/scripts/test_nous_credentials.py
          skills/summon/scripts/test_windows_credentials.py
          skills/summon/scripts/test_launch_binding.py
          skills/summon/scripts/test_launch_qualification.py
          skills/summon/scripts/test_launch_observer_acceptance.py
          skills/summon/scripts/test_job_revocation_admission_acceptance.py
          skills/summon/scripts/test_r01_r02_launch_chain_acceptance.py
          skills/summon/scripts/test_council_reader_acceptance.py
          skills/summon/scripts/test_council_between_round_acceptance.py
          tests/test_council_intermediate_process_acceptance.py
          skills/summon/scripts/test_deliberation_public_history_acceptance.py
          skills/summon/scripts/test_transport_refusal_acceptance.py
          skills/summon/scripts/test_attachment_transport_acceptance.py
          skills/summon/scripts/test_transport_adapter_acceptance.py
          tests/test_transport_adapter_exact_acceptance.py
          tests/test_operator_transport_boundary_acceptance.py
          skills/summon/scripts/test_chat_launch_guard.py
          skills/summon/scripts/test_chat_launch_guard_acceptance.py
          skills/summon/scripts/test_resume_revalidation_acceptance.py
          skills/summon/scripts/test_jobs_revalidation_cli_acceptance.py
          skills/summon/scripts/test_roster_drift_acceptance.py
          skills/summon/scripts/test_chat_source_family_acceptance.py
          skills/summon/scripts/test_chat_guard_boundary_acceptance.py
          skills/summon/scripts/test_chat_revalidation_refusal_acceptance.py
          skills/summon/scripts/test_chat_source_family_runtime_acceptance.py
          skills/summon/scripts/test_chat_revalidation_input_acceptance.py
          skills/summon/scripts/test_chat_legacy_migration_acceptance.py
          skills/summon/scripts/test_chat_public_migration_journey_acceptance.py
          skills/summon/scripts/test_chat_migration_interruption_acceptance.py
          skills/summon/scripts/test_conversation_numeric_version_acceptance.py
          skills/summon/scripts/test_chat_dispatcher_guard_v2_acceptance.py
          skills/summon/scripts/test_chat_parent_runtime_acceptance.py

      - name: Unit tests (launch and provenance provider-inert contracts)
        run: >-
          python -m pytest -q
          skills/summon/scripts/test_dispatcher_launch_publication_acceptance.py
          skills/summon/scripts/test_launch_observer.py
          tests/test_windows_silent_launch.py

      - name: Unit tests (ACP transport, fake subprocess only)
        run: python tests/test_acpbackend.py

      - name: Unit tests (conversation atlas)
        run: >-
          python -m unittest
          skills.summon.scripts.test_conversation
          skills.summon.scripts.test_conversation_runtime
          skills.summon.scripts.test_conversation_ui

      - name: Unit tests (workspace UI loopback)
        run: >-
          python -m pytest -q
          skills/summon/scripts/test_workspace_loopback_acceptance.py
          skills/summon/scripts/test_workspace_capability_snapshot.py
          skills/summon/scripts/test_workspace_details.py
          skills/summon/scripts/test_workspace_canonical_rendered.py
          skills/summon/scripts/test_workspace_delivery_rendered.py
          skills/summon/scripts/test_workspace_accessibility_rendered.py
          skills/summon/scripts/test_workspace_recovery_rendered.py

      - name: Unit tests (Windows workspace privacy controls)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python -m pytest -q skills/summon/scripts/test_workspace_os_privacy.py

      - name: Unit tests (guarded workspace economics acceptance)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SUMMON_TELEMETRY: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -B -m pytest -q -p no:cacheprovider --rootdir=. --tb=short
          skills/summon/scripts/test_workspace_economics_guarded_acceptance.py

      - name: Unit tests (swarm protocol contract)
        run: >-
          python -m unittest
          skills.summon.scripts.test_swarm_protocol
          skills.summon.scripts.test_swarm_coordinator

      - name: Unit tests (F01 artifact identity acceptance)
        run: >-
          python -m pytest -q
          skills/summon/scripts/test_f01_artifact_identity_acceptance.py

      - name: Unit tests (F01 strict entity acceptance)
        run: >-
          python -m pytest -q
          skills/summon/scripts/test_f01_strict_entity_acceptance.py

      - name: Unit tests (workspace reconstruction acceptance)
        run: >-
          python -m pytest -q
          skills/summon/scripts/test_workspace_rebuild_acceptance.py

      - name: Unit tests (deliberation preview kernel, adapter, scheduler, and CLI)
        run: >-
          python -m unittest
          skills.summon.scripts.test_deliberation_engine
          skills.summon.scripts.test_deliberation_policy
          skills.summon.scripts.test_deliberation_adapter
          skills.summon.scripts.test_deliberation_cli
          skills.summon.scripts.test_deliberation_scheduler
          skills.summon.scripts.test_deliberation_agents
          skills.summon.scripts.test_deliberation_roster
          skills.summon.scripts.test_deliberation_invocation
          skills.summon.scripts.test_deliberation_replay
          skills.summon.scripts.test_deliberation_restore
          skills.summon.scripts.test_deliberation_recovery
          skills.summon.scripts.test_deliberation_phase_a
          skills.summon.scripts.test_deliberation_live
          skills.summon.scripts.test_deliberation_browser
          skills.summon.scripts.test_deliberation_ui

      - name: Unit tests (deliberation resume)
        run: python -m unittest skills.summon.scripts.test_deliberation_resume

      - name: Unit tests (model catalog)
        run: python -m pytest -q skills/summon/scripts/test_astra_roster.py skills/summon/scripts/test_model_catalog.py tests/test_gemini_roster.py

      - name: Unit tests (backend/model routing preflight)
        run: python -m unittest skills.summon.scripts.test_model_routing

      - name: Doctor runs clean on a bare machine (exit 1 = no backends, still valid JSON)
        shell: bash
        run: |
          python summon.py --doctor || true
          python summon.py --doctor --json > doctor.json || true
          python -c "import json; d=json.load(open('doctor.json')); assert isinstance(d['ok'], bool); print('doctor JSON ok, usable:', d['usable_backends'])"

      - name: List bundled agents
        shell: bash
        run: |
          python summon.py --list --agents-dir skills/summon/agents > agents.json
          python -c "import json; d=json.load(open('agents.json')); assert len(d['agents']) >= 20, d; print(len(d['agents']), 'agents')"

      - name: Model discovery (static sources only on CI)
        shell: bash
        run: |
          python summon.py --list-models > models.json
          python -c "import json; m=json.load(open('models.json'))['models']; assert set(m) == {'claude','codex','agy','cursor-agent','gemini','kimi','opencode','arkcli','zcode'}; print({k: v['source'] for k, v in m.items()})"

      - name: Dry-run resolves without executing (no backend needed)
        shell: bash
        run: |
          python summon.py --agent reviewer --prompt "x" --cwd "$PWD" --agents-dir skills/summon/agents --dry-run > dry.json
          python -c "import json; d=json.load(open('dry.json')); assert d['dry_run'] and d['cli']=='codex' and d['permission_flags'], d"

      - name: Manifest + schema examples parse and validate
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "skills/summon/scripts")
          import _schema
          json.load(open("examples/jobs.json"))
          schema = json.load(open("examples/verdict.schema.json"))
          good = {"verdict": "block", "confidence": 0.9,
                  "findings": [{"severity": "critical", "summary": "x"}]}
          assert _schema.validate(good, schema) == []
          bad = {"verdict": "maybe", "confidence": 2, "findings": []}
          assert _schema.validate(bad, schema)  # enum + maximum violations
          print("examples valid; schema validator agrees")
          PY

      - name: Unit tests (format inventory)
        run: >-
          python -m pytest -q
          tests/test_schema_inventory.py
          tests/test_format_inventory.py
          tests/test_format_inventory_l02_acceptance.py
          tests/test_format_inventory_reader_contract.py
          tests/test_format_inventory_context.py
          tests/test_format_inventory_fleet.py
          tests/test_format_inventory_nonworkspace.py
          tests/test_format_inventory_workspace.py
          tests/test_format_inventory_final_structures.py

      - name: Installer dry-run
        shell: bash
        run: |
          mkdir -p "$HOME/.claude"
          python install.py --dry-run

      - name: Installer safety - unowned dir refused with EXACT exit 2
        shell: bash
        run: |
          # Refusal must be the specific exit code 2 (not just "nonzero").
          mkdir -p "$HOME/.claude/skills/summon"
          touch "$HOME/.claude/skills/summon/USER_FILE"
          set +e
          python install.py --hosts claude --uninstall; rc1=$?
          python install.py --hosts claude --no-agents; rc2=$?
          set -e
          [ "$rc1" -eq 2 ] || { echo "uninstall refusal: expected 2, got $rc1"; exit 1; }
          [ "$rc2" -eq 2 ] || { echo "reinstall refusal: expected 2, got $rc2"; exit 1; }
          test -f "$HOME/.claude/skills/summon/USER_FILE"
          rm -rf "$HOME/.claude/skills/summon"
          echo "ownership guard holds (exit 2 exactly)"

      - name: Installed copy end-to-end + bundled-roster fallback (real host dir)
        shell: bash
        run: |
          python install.py --hosts claude
          test -f "$HOME/.claude/skills/summon/SKILL.md"
          test -f "$HOME/.claude/skills/summon/.summon-install.json"
          test -f "$HOME/.claude/skills/council/SKILL.md"
          test -f "$HOME/.claude/skills/deliberate/SKILL.md"
          # agents/ MUST ship inside the installed skill — it is the bundled-fallback
          # source. (Guards against a regression that drops it from SKILL_PAYLOAD.)
          test -d "$HOME/.claude/skills/summon/agents"
          ls "$HOME/.claude/skills/summon/agents"/*.md >/dev/null
          # Cold dispatch: no --agents-dir, no SUB_AGENTS_DIR, empty project dir ->
          # the installed skill must still list its bundled roster via the fallback.
          mkdir -p "$RUNNER_TEMP/emptyproj"
          env -u SUB_AGENTS_DIR python "$HOME/.claude/skills/summon/scripts/run_subagent.py" \
            --list --cwd "$RUNNER_TEMP/emptyproj" > listed.json
          python -c "import json; d=json.load(open('listed.json')); assert len(d['agents']) >= 20, d; print('bundled fallback lists', len(d['agents']), 'agents')"
          python install.py --hosts claude --uninstall
          test ! -d "$HOME/.claude/skills/summon"
          test ! -d "$HOME/.claude/skills/council"
          test ! -d "$HOME/.claude/skills/deliberate"
          echo "installed copy: bundled agents present + cold fallback dispatch + clean uninstall"

  release-evidence-windows:
    # Retain the platform-qualified candidate evidence produced on Windows.
    # This is intentionally separate from the Ubuntu preview below: neither
    # job may claim that the other platform ran its scoped gates.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install test and rendered-evidence dependencies
        shell: pwsh
        run: |
          python -m pip install "pytest>=8,<9" "playwright>=1.52,<2"
          python -m playwright install chromium
      - name: Generate Windows-qualified candidate evidence
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath plugin.json -Raw | ConvertFrom-Json).version
          $chromium = python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_gates.py --require-clean --chromium-executable $chromium --output "$env:RUNNER_TEMP\release-evidence.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_manifest.py `
            --evidence-file "$env:RUNNER_TEMP\release-evidence.json" `
            --output "$env:RUNNER_TEMP\release-manifest.json" `
            --expected-version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          evidence = json.loads((root / "release-evidence.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          qualification = evidence["platform_qualification"]
          assert qualification["host"] == "windows", qualification
          assert qualification["windows_evidence"] == "available", qualification
          assert qualification["status"] == "qualified", qualification
          assert set(qualification["windows_scoped_gates"].values()) == {"pass"}, qualification
          assert manifest["evidence"]["source_tree_sha256"] == evidence["source_tree_sha256"]
          print("Windows candidate evidence retained with qualified platform gates")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows-qualified candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: summon-release-evidence-windows-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/release-manifest.json
            ${{ runner.temp }}/release-evidence.gates/gate.accessibility.json
            ${{ runner.temp }}/release-evidence.gates/gate.browser_security.json
            ${{ runner.temp }}/release-evidence.gates/gate.fake_lifecycle.json
            ${{ runner.temp }}/release-evidence.gates/gate.live_provider.json
            ${{ runner.temp }}/release-evidence.gates/gate.managed_installs.json
            ${{ runner.temp }}/release-evidence.gates/gate.migration_rollback.json
            ${{ runner.temp }}/release-evidence.gates/gate.model_identity.json
            ${{ runner.temp }}/release-evidence.gates/gate.telemetry_privacy.json
            ${{ runner.temp }}/release-evidence.gates/rendered/browser-toolchain.json
            ${{ runner.temp }}/release-evidence.gates/rendered/measurements.json
            ${{ runner.temp }}/release-evidence.gates/rendered/u08-observations.json
            ${{ runner.temp }}/release-evidence.gates/rendered/canonical-artifact-separate-scope.png
            ${{ runner.temp }}/release-evidence.gates/rendered/canonical-focal-task-scope.png
            ${{ runner.temp }}/release-evidence.gates/rendered/terminal-guidance-and-model-uncertainty.png
            ${{ runner.temp }}/release-evidence.gates/rendered/pending-action-authentication-expiry.png
            ${{ runner.temp }}/release-evidence.gates/rendered/authentication-focus.png
            ${{ runner.temp }}/release-evidence.gates/rendered/desktop-workspace-focus.png
            ${{ runner.temp }}/release-evidence.gates/rendered/desktop-workspace.png
            ${{ runner.temp }}/release-evidence.gates/rendered/desktop-drawer.png
