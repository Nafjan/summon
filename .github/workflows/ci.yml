  release-evidence-info:
    # Ubuntu retains validated incomplete producer diagnostics only.
    # It never constructs a qualifying release manifest or waives a gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9" "playwright>=1.52,<2"
      - name: Install Chromium for rendered release evidence
        run: python -m playwright install --with-deps chromium
      - name: Generate and validate incomplete producer diagnostics
        shell: bash
        run: |
          CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/release_gates.py --require-clean --chromium-executable "$CHROMIUM" --output "$RUNNER_TEMP/release-evidence.json"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import release_gates
          release_gates.validate_incomplete_diagnostics(Path(os.environ["RUNNER_TEMP"]) / "release-evidence.json", Path.cwd())
          evidence = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "release-evidence.json"), encoding="utf-8"))
          assert set(evidence["tests"]) == {
              "discovery", "install", "release_manifest", "acpbackend",
              "deliberation", "deliberation_resume", "model_catalog",
              "conversation", "conversation_runtime", "conversation_ui", "model_routing", "release_contract",
              "swarm_protocol", "swarm_coordinator", "account_evidence", "release_gates", "live_provider_gate",
              "telemetry_audit", "workspace_plan", "workspace_core", "workspace_demo", "workspace_recovery", "workspace_ui",
              "phase0_phase1", "phase0_launch", "release_outcomes", "schema_inventory",
          }
          assert evidence["version_contract"]["ready"]
          expected_gates = {
              "accessibility", "browser_security", "fake_lifecycle",
              "live_provider", "managed_installs", "migration_rollback",
              "model_identity", "telemetry_privacy",
          }
          assert set(evidence["known_gates"]) == expected_gates
          qualification = evidence["platform_qualification"]
          assert set(qualification) == {
              "schema", "host", "windows_evidence", "windows_scoped_gates", "status",
          }
          assert qualification["schema"] == 1
          assert qualification["host"] == "non_windows"
          assert qualification["windows_evidence"] == "unavailable"
          assert qualification["status"] == "incomplete"
          assert set(qualification["windows_scoped_gates"]) == {
              "migration_rollback", "browser_security", "accessibility",
          }
          assert set(qualification["windows_scoped_gates"].values()) == {"unavailable"}
          assert evidence["known_gates"]["live_provider"] == "blocked"
          scoped = set(qualification["windows_scoped_gates"])
          assert all(
              value == "pass"
              for name, value in evidence["known_gates"].items()
              if name not in {"live_provider"} | scoped
          ), evidence["known_gates"]
          print("Validated incomplete producer diagnostics; no release manifest or qualification produced")
          PY

      - name: Upload validated incomplete producer diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: summon-release-diagnostics-ubuntu-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/release-evidence.gates/gate.accessibility.json
            ${{ runner.temp }}/release-evidence.gates/gate.browser_security.json
            ${{ runner.temp }}/release-evidence.gates/gate.fake_lifecycle.json
            ${{ runner.temp }}/release-evidence.gates/gate.live_provider.json
            ${{ runner.temp }}/release-evidence.gates/gate.managed_installs.json
            ${{ runner.temp }}/release-evidence.gates/gate.migration_rollback.json
            ${{ runner.temp }}/release-evidence.gates/gate.model_identity.json
            ${{ runner.temp }}/release-evidence.gates/gate.telemetry_privacy.json
            ${{ runner.temp }}/release-evidence.gates/rendered/browser-toolchain.json
            ${{ runner.temp }}/release-evidence.gates/rendered/measurements.json
            ${{ runner.temp }}/release-evidence.gates/rendered/u08-observations.json
