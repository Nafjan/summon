name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Compile all modules
        run: python -m py_compile skills/summon/scripts/run_subagent.py skills/summon/scripts/_loader.py skills/summon/scripts/_resolver.py skills/summon/scripts/_builder.py skills/summon/scripts/_executor.py skills/summon/scripts/_stream.py skills/summon/scripts/_doctor.py skills/summon/scripts/_rundir.py skills/summon/scripts/_council.py skills/summon/scripts/_manifest.py skills/summon/scripts/_jobs.py skills/summon/scripts/_receipt.py skills/summon/scripts/_installs.py skills/summon/scripts/_cli.py skills/summon/scripts/_background.py skills/summon/scripts/_telemetry.py skills/summon/scripts/_deliberation.py skills/summon/scripts/_deliberation_agents.py skills/summon/scripts/_deliberation_store.py skills/summon/scripts/_deliberation_browser.py skills/summon/scripts/_deliberation_scheduler.py skills/summon/scripts/_deliberation_roster.py skills/summon/scripts/_deliberation_invocation.py skills/summon/scripts/_deliberation_replay.py skills/summon/scripts/_deliberation_recovery.py skills/summon/scripts/_deliberation_resume.py skills/summon/scripts/_deliberation_adapter.py skills/summon/scripts/_deliberation_phase_a.py skills/summon/scripts/_deliberation_live.py skills/summon/scripts/_deliberation_ui.py skills/summon/scripts/_conversation.py skills/summon/scripts/_conversation_page.py skills/summon/scripts/_conversation_runtime.py skills/summon/scripts/_swarm_protocol.py skills/summon/scripts/_swarm_coordinator.py skills/summon/scripts/_conversation_browser.py skills/summon/scripts/_conversation_ui.py skills/summon/scripts/_model_catalog.py tools/release_manifest.py tools/release_gates.py tools/release_contract.py summon.py install.py

      - name: Unit tests (dispatcher)
        run: python skills/summon/scripts/test_discovery.py

      - name: Unit tests (installer safety, isolated fake homes)
        run: python tests/test_install.py

      - name: Unit tests (release evidence manifest)
        run: python -m unittest tests.test_release_manifest tests.test_live_provider_gate

      - name: Unit tests (release version and migration contract)
        run: python -m unittest tests.test_release_contract

      - name: Unit tests (migration and telemetry GA gates)
        run: >-
          python -m unittest
          tests.test_migration_gate
          tests.test_telemetry_gate

      - name: Unit tests (release evidence runner)
        run: python -m unittest tests.test_release_gates

      - name: Unit tests (ACP transport, fake subprocess only)
        run: python tests/test_acpbackend.py

      - name: Unit tests (conversation atlas)
        run: >-
          python -m unittest
          skills.summon.scripts.test_conversation
          skills.summon.scripts.test_conversation_runtime
          skills.summon.scripts.test_conversation_ui

      - name: Unit tests (swarm protocol contract)
        run: >-
          python -m unittest
          skills.summon.scripts.test_swarm_protocol
          skills.summon.scripts.test_swarm_coordinator

      - name: Unit tests (deliberation preview kernel, adapter, scheduler, and CLI)
        run: >-
          python -m unittest
          skills.summon.scripts.test_deliberation_engine
          skills.summon.scripts.test_deliberation_policy
          skills.summon.scripts.test_deliberation_adapter
          skills.summon.scripts.test_deliberation_cli
          skills.summon.scripts.test_deliberation_scheduler
          skills.summon.scripts.test_deliberation_agents
          skills.summon.scripts.test_deliberation_roster
          skills.summon.scripts.test_deliberation_invocation
          skills.summon.scripts.test_deliberation_replay
          skills.summon.scripts.test_deliberation_restore
          skills.summon.scripts.test_deliberation_recovery
          skills.summon.scripts.test_deliberation_phase_a
          skills.summon.scripts.test_deliberation_live
          skills.summon.scripts.test_deliberation_browser
          skills.summon.scripts.test_deliberation_ui

      - name: Unit tests (deliberation resume)
        run: python -m unittest skills.summon.scripts.test_deliberation_resume

      - name: Unit tests (model catalog)
        run: python -m unittest skills.summon.scripts.test_model_catalog

      - name: Unit tests (backend/model routing preflight)
        run: python -m unittest skills.summon.scripts.test_model_routing

      - name: Doctor runs clean on a bare machine (exit 1 = no backends, still valid JSON)
        shell: bash
        run: |
          python summon.py --doctor || true
          python summon.py --doctor --json > doctor.json || true
          python -c "import json; d=json.load(open('doctor.json')); assert isinstance(d['ok'], bool); print('doctor JSON ok, usable:', d['usable_backends'])"

      - name: List bundled agents
        shell: bash
        run: |
          python summon.py --list --agents-dir skills/summon/agents > agents.json
          python -c "import json; d=json.load(open('agents.json')); assert len(d['agents']) >= 20, d; print(len(d['agents']), 'agents')"

      - name: Model discovery (static sources only on CI)
        shell: bash
        run: |
          python summon.py --list-models > models.json
          python -c "import json; m=json.load(open('models.json'))['models']; assert set(m) == {'claude','codex','agy','cursor-agent','gemini','kimi'}; print({k: v['source'] for k, v in m.items()})"

      - name: Dry-run resolves without executing (no backend needed)
        shell: bash
        run: |
          python summon.py --agent reviewer --prompt "x" --cwd "$PWD" --agents-dir skills/summon/agents --dry-run > dry.json
          python -c "import json; d=json.load(open('dry.json')); assert d['dry_run'] and d['cli']=='codex' and d['permission_flags'], d"

      - name: Manifest + schema examples parse and validate
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "skills/summon/scripts")
          import _schema
          json.load(open("examples/jobs.json"))
          schema = json.load(open("examples/verdict.schema.json"))
          good = {"verdict": "block", "confidence": 0.9,
                  "findings": [{"severity": "critical", "summary": "x"}]}
          assert _schema.validate(good, schema) == []
          bad = {"verdict": "maybe", "confidence": 2, "findings": []}
          assert _schema.validate(bad, schema)  # enum + maximum violations
          print("examples valid; schema validator agrees")
          PY

      - name: Installer dry-run
        shell: bash
        run: |
          mkdir -p "$HOME/.claude"
          python install.py --dry-run

      - name: Installer safety - unowned dir refused with EXACT exit 2
        shell: bash
        run: |
          # Refusal must be the specific exit code 2 (not just "nonzero").
          mkdir -p "$HOME/.claude/skills/summon"
          touch "$HOME/.claude/skills/summon/USER_FILE"
          set +e
          python install.py --hosts claude --uninstall; rc1=$?
          python install.py --hosts claude --no-agents; rc2=$?
          set -e
          [ "$rc1" -eq 2 ] || { echo "uninstall refusal: expected 2, got $rc1"; exit 1; }
          [ "$rc2" -eq 2 ] || { echo "reinstall refusal: expected 2, got $rc2"; exit 1; }
          test -f "$HOME/.claude/skills/summon/USER_FILE"
          rm -rf "$HOME/.claude/skills/summon"
          echo "ownership guard holds (exit 2 exactly)"

      - name: Installed copy end-to-end + bundled-roster fallback (real host dir)
        shell: bash
        run: |
          python install.py --hosts claude
          test -f "$HOME/.claude/skills/summon/SKILL.md"
          test -f "$HOME/.claude/skills/summon/.summon-install.json"
          test -f "$HOME/.claude/skills/council/SKILL.md"
          test -f "$HOME/.claude/skills/deliberate/SKILL.md"
          # agents/ MUST ship inside the installed skill — it is the bundled-fallback
          # source. (Guards against a regression that drops it from SKILL_PAYLOAD.)
          test -d "$HOME/.claude/skills/summon/agents"
          ls "$HOME/.claude/skills/summon/agents"/*.md >/dev/null
          # Cold dispatch: no --agents-dir, no SUB_AGENTS_DIR, empty project dir ->
          # the installed skill must still list its bundled roster via the fallback.
          mkdir -p "$RUNNER_TEMP/emptyproj"
          env -u SUB_AGENTS_DIR python "$HOME/.claude/skills/summon/scripts/run_subagent.py" \
            --list --cwd "$RUNNER_TEMP/emptyproj" > listed.json
          python -c "import json; d=json.load(open('listed.json')); assert len(d['agents']) >= 20, d; print('bundled fallback lists', len(d['agents']), 'agents')"
          python install.py --hosts claude --uninstall
          test ! -d "$HOME/.claude/skills/summon"
          test ! -d "$HOME/.claude/skills/council"
          test ! -d "$HOME/.claude/skills/deliberate"
          echo "installed copy: bundled agents present + cold fallback dispatch + clean uninstall"

  release-evidence:
    # This job exercises the same machine-produced evidence path used for a
    # release candidate, without pretending that the still-deferred live and
    # migration gates have passed. The GA release job must add --check only
    # after those fixed gate harnesses exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate and bind machine release evidence
        shell: bash
        run: |
          python tools/release_gates.py --require-clean --output "$RUNNER_TEMP/release-evidence.json"
          python tools/release_manifest.py \
            --evidence-file "$RUNNER_TEMP/release-evidence.json" \
            --output "$RUNNER_TEMP/release-manifest.json" \
            --expected-version "3.0.0"
          python - <<'PY'
          import json
          import os
          evidence = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "release-evidence.json"), encoding="utf-8"))
          manifest = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "release-manifest.json"), encoding="utf-8"))
          assert set(evidence["tests"]) == {
              "discovery", "install", "release_manifest", "acpbackend",
              "deliberation", "deliberation_resume", "model_catalog",
              "conversation", "conversation_runtime", "conversation_ui", "model_routing", "release_contract",
              "swarm_protocol", "swarm_coordinator", "account_evidence", "release_gates", "live_provider_gate",
          }
          assert manifest["evidence"]["source_tree_sha256"] == evidence["source_tree_sha256"]
          assert manifest["version_contract"]["ready"]
          expected_gates = {
              "accessibility", "browser_security", "fake_lifecycle",
              "live_provider", "managed_installs", "migration_rollback",
              "model_identity", "telemetry_privacy",
          }
          assert set(evidence["known_gates"]) == expected_gates
          assert evidence["known_gates"]["live_provider"] == "blocked"
          assert all(
              value == "pass"
              for name, value in evidence["known_gates"].items()
              if name != "live_provider"
          ), evidence["known_gates"]
          print("machine evidence bound; only the explicitly deferred live-provider gate is blocked")
          PY
