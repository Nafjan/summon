<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="summon — any AI CLI can summon the others as sub-agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#141A38"/>
      <stop offset="1" stop-color="#0A0E1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow2)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="18.5" fill="none" stroke="#2A335B" stroke-width="1.5"/>

  <!-- wordmark -->
  <text x="72" y="128" class="mono" font-size="86" font-weight="700" fill="url(#wordmark)">/summon</text>
  <text x="76" y="182" class="sans" font-size="27" font-weight="600" fill="#E7ECFF">Summon any AI, from any CLI.</text>
  <text x="76" y="216" class="sans" font-size="19" fill="#93A0C4">One skill turns your agent into a conductor for all</text>
  <text x="76" y="242" class="sans" font-size="19" fill="#93A0C4">the others. Dispatch, swarm, or convene a council.</text>

  <!-- install command chip -->
  <rect x="76" y="278" width="452" height="46" rx="10" fill="#0E1430" stroke="#3B2E6E" stroke-width="1.5"/>
  <text x="96" y="307" class="mono" font-size="20" fill="#67E8F9">npx skills add<tspan fill="#E7ECFF"> Nafjan/summon</tspan></text>

  <!-- hub + seven backends (claude, codex, cursor, kimi, gemini, antigravity, modelark) -->
  <g>
    <line x1="800" y1="180" x2="930" y2="42"  stroke="#3A3566" stroke-width="1.5"/>
    <line x1="800" y1="180" x2="944" y2="88"  stroke="#3A3566" stroke-width="1.5"/>
    <line x1="800" y1="180" x2="952" y2="134" stroke="#3A3566" stroke-width="1.5"/>
    <line x1="800" y1="180" x2="956" y2="180" stroke="#3A3566" stroke-width="1.5"/>
    <line x1="800" y1="180" x2="952" y2="226" stroke="#3A3566" stroke-width="1.5"/>
    <line x1="800" y1="180" x2="944" y2="272" stroke="#3A3566" stroke-width="1.5"/>
    <line x1="800" y1="180" x2="930" y2="318" stroke="#3A3566" stroke-width="1.5"/>

    <circle cx="800" cy="180" r="48" fill="#160E33" stroke="#8B5CF6" stroke-width="2"/>
    <text x="800" y="176" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#C4B5FD">any</text>
    <text x="800" y="196" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#C4B5FD">host</text>

    <g class="sans" font-size="14" font-weight="600">
      <g><rect x="932" y="26"  width="118" height="30" rx="15" fill="#171E3E" stroke="#3B4570" stroke-width="1.3"/><text x="991" y="46"  text-anchor="middle" fill="#CDD6F4">claude</text></g>
      <g><rect x="946" y="72"  width="118" height="30" rx="15" fill="#171E3E" stroke="#3B4570" stroke-width="1.3"/><text x="1005" y="92" text-anchor="middle" fill="#CDD6F4">codex</text></g>
      <g><rect x="954" y="118" width="118" height="30" rx="15" fill="#171E3E" stroke="#3B4570" stroke-width="1.3"/><text x="1013" y="138" text-anchor="middle" fill="#CDD6F4">cursor</text></g>
      <g><rect x="958" y="164" width="118" height="30" rx="15" fill="#171E3E" stroke="#3B4570" stroke-width="1.3"/><text x="1017" y="184" text-anchor="middle" fill="#CDD6F4">kimi</text></g>
      <g><rect x="954" y="210" width="118" height="30" rx="15" fill="#171E3E" stroke="#3B4570" stroke-width="1.3"/><text x="1013" y="230" text-anchor="middle" fill="#CDD6F4">gemini</text></g>
      <g><rect x="946" y="256" width="134" height="30" rx="15" fill="#171E3E" stroke="#3B4570" stroke-width="1.3"/><text x="1013" y="276" text-anchor="middle" fill="#CDD6F4">antigravity</text></g>
      <g><rect x="932" y="302" width="134" height="30" rx="15" fill="#171E3E" stroke="#3B4570" stroke-width="1.3"/><text x="999" y="322" text-anchor="middle" fill="#CDD6F4">modelark</text></g>
    </g>
  </g>
</svg>
